<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6feb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Инструкции для водителей — единый справочник">
  <title>Инструкции для водителей</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Инструкции">
  <!-- ?v=... — версия кеша. При изменении css/js меняй число здесь И в импортах app.js,
       иначе браузер (и установленная PWA) покажет старую закешированную версию. -->
  <link rel="stylesheet" href="assets/css/styles.css?v=2">
</head>
<body>
  <header class="app-header">
    <div class="app-header__row">
      <button class="icon-btn app-header__back" id="back-btn" hidden aria-label="Назад">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 19l-7-7 7-7"/></svg>
      </button>
      <h1 class="app-header__title" id="header-title">Инструкции</h1>
    </div>
    <div class="search">
      <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
      </svg>
      <input
        type="search"
        id="search-input"
        class="search__input"
        placeholder="Поиск по инструкциям…"
        autocomplete="off"
        aria-label="Поиск по инструкциям">
      <button class="search__clear" id="search-clear" hidden aria-label="Очистить поиск">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </header>

  <main class="app-main" id="view" aria-live="polite"></main>

  <footer class="app-footer">
    <span id="footer-meta"></span>
  </footer>

  <!-- Просмотр файла -->
  <div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="viewer-title">
    <div class="viewer__bar">
      <button class="icon-btn" id="viewer-close" aria-label="Закрыть">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <span class="viewer__title" id="viewer-title"></span>
      <a class="icon-btn" id="viewer-open" href="#" target="_blank" rel="noopener" aria-label="Открыть на Google Диске">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M14 4h6v6M20 4l-9 9"/>
          <path d="M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5"/>
        </svg>
      </a>
    </div>
    <div class="viewer__body" id="viewer-body"></div>
  </div>

  <script type="module" src="assets/js/app.js?v=2"></script>
</body>
</html>
