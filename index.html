<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6feb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
  <meta name="description" content="База знаний компании HEAD, HDLG — инструкции для водителей: оплата дорог, документы, ТАХО, топливо, ДТП и видео">
  <title>База знаний компании HEAD, HDLG — инструкции для водителей</title>

  <!-- Карточка при отправке ссылки (Open Graph / Telegram, WhatsApp, Viber, Facebook и т.д.).
       og:image ДОЛЖЕН быть абсолютным URL. При замене картинки меняй и ?v= в конце,
       иначе мессенджеры покажут старую из своего кеша. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="HEAD, HDLG">
  <meta property="og:title" content="База знаний компании HEAD, HDLG">
  <meta property="og:description" content="Инструкции для водителей: оплата дорог, документы, ТАХО, топливо, ДТП и видео — всё в одном месте.">
  <meta property="og:url" content="https://siahead2017-png.github.io/Driver_Instructions/">
  <meta property="og:image" content="https://siahead2017-png.github.io/Driver_Instructions/assets/og-image.jpg?v=1">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="База знаний компании HEAD, HDLG">
  <meta property="og:locale" content="ru_RU">

  <!-- Twitter/X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="База знаний компании HEAD, HDLG">
  <meta name="twitter:description" content="Инструкции для водителей: оплата дорог, документы, ТАХО, топливо, ДТП и видео — всё в одном месте.">
  <meta name="twitter:image" content="https://siahead2017-png.github.io/Driver_Instructions/assets/og-image.jpg?v=1">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon-192.png?v=4" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png?v=4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Инструкции HEAD, HDLG">
  <!-- ?v=... — версия кеша. При изменении css/js меняй число здесь И в импортах app.js,
       иначе браузер (и установленная PWA) покажет старую закешированную версию. -->
  <link rel="stylesheet" href="assets/css/styles.css?v=4">
</head>
<body>
  <header class="app-header">
    <div class="app-header__row">
      <button class="icon-btn app-header__back" id="back-btn" hidden aria-label="Назад">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 19l-7-7 7-7"/></svg>
      </button>
      <h1 class="app-header__title" id="header-title">Инструкции</h1>
    </div>
    <div class="search">
      <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
      </svg>
      <input
        type="search"
        id="search-input"
        class="search__input"
        placeholder="Поиск по инструкциям…"
        autocomplete="off"
        aria-label="Поиск по инструкциям">
      <button class="search__clear" id="search-clear" hidden aria-label="Очистить поиск">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </header>

  <main class="app-main" id="view" aria-live="polite"></main>

  <footer class="app-footer">
    <span id="footer-meta"></span>
  </footer>

  <!-- Просмотр файла -->
  <div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="viewer-title">
    <div class="viewer__bar">
      <button class="icon-btn" id="viewer-close" aria-label="Закрыть">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <span class="viewer__title" id="viewer-title"></span>
      <a class="icon-btn" id="viewer-open" href="#" target="_blank" rel="noopener" aria-label="Открыть на Google Диске">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M14 4h6v6M20 4l-9 9"/>
          <path d="M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5"/>
        </svg>
      </a>
    </div>
    <div class="viewer__body" id="viewer-body"></div>
  </div>

  <!-- Плавающая кнопка калькулятора: время + топливо + маршрут -->
  <button class="calc-fab" id="calc-fab" type="button" aria-label="Калькулятор времени и топлива">
    <span class="calc-fab__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    </span>
    <span class="calc-fab__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M5 20V6a2 2 0 012-2h4a2 2 0 012 2v14"/>
        <path d="M3 20h12"/>
        <rect x="6.5" y="6.5" width="5" height="3.5" rx=".5"/>
        <path d="M13 10.5h3a1.5 1.5 0 011.5 1.5v4a1.5 1.5 0 003 0V9l-2.5-2.5"/>
      </svg>
    </span>
    <span class="calc-fab__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <rect x="8" y="7" width="12" height="8" rx="1"/>
        <path d="M8 15V10H5l-2 3v2"/>
        <circle cx="6" cy="17" r="1.6"/>
        <circle cx="16" cy="17" r="1.6"/>
      </svg>
    </span>
    <span class="calc-fab__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M5 18a2.5 2.5 0 010-5h9a2.5 2.5 0 000-5H8"/>
        <circle cx="5" cy="18" r="1.4"/>
        <path d="M15 4l3 3-3 3"/>
      </svg>
    </span>
  </button>

  <!-- Виджет расчёта времени до точки -->
  <div class="calc" id="calc" hidden role="dialog" aria-modal="true" aria-labelledby="calc-title">
    <div class="calc__backdrop" id="calc-backdrop"></div>
    <div class="calc__card" role="document">
      <div class="calc__head">
        <h2 class="calc__title" id="calc-title">Время до точки</h2>
        <button class="icon-btn" id="calc-close" type="button" aria-label="Закрыть">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="calc__body">
        <div class="calc__result" aria-live="polite">
          <span class="calc__result-label">Время в пути</span>
          <span class="calc__time" id="calc-time">—:—</span>
          <span class="calc__arrival" id="calc-arrival"></span>
          <span class="calc__breakdown" id="calc-breakdown"></span>
        </div>

        <div class="calc__fields">
          <label class="calc__field">
            <span class="calc__field-label">Расстояние, км</span>
            <input class="calc__input" id="calc-dist" type="number" inputmode="decimal"
              min="0" step="1" placeholder="0" autocomplete="off">
          </label>
          <label class="calc__field">
            <span class="calc__field-label">Скорость, км/ч</span>
            <input class="calc__input" id="calc-speed" type="number" inputmode="decimal"
              min="1" step="1" placeholder="70" autocomplete="off">
          </label>
        </div>

        <fieldset class="calc__pauses">
          <legend class="calc__field-label">Паузы в пути</legend>
          <div class="calc__chips">
            <label class="calc__chip"><input type="checkbox" id="calc-p9"  value="9"><span>Пауза 9 ч</span></label>
            <label class="calc__chip"><input type="checkbox" id="calc-p24" value="24"><span>Пауза 24 ч</span></label>
            <label class="calc__chip"><input type="checkbox" id="calc-p45" value="45"><span>Пауза 45 ч</span></label>
            <label class="calc__chip"><input type="checkbox" id="calc-p2"  value="2"><span>Остановка 2 ч</span></label>
          </div>
        </fieldset>

        <div class="calc__extra">
          <span class="calc__field-label">Своя пауза</span>
          <div class="calc__extra-row">
            <label class="calc__field calc__field--sm">
              <span class="calc__field-sub">часы</span>
              <input class="calc__input" id="calc-eh" type="number" inputmode="numeric"
                min="0" step="1" placeholder="0" autocomplete="off">
            </label>
            <label class="calc__field calc__field--sm">
              <span class="calc__field-sub">минуты</span>
              <input class="calc__input" id="calc-em" type="number" inputmode="numeric"
                min="0" max="59" step="1" placeholder="0" autocomplete="off">
            </label>
          </div>
        </div>

        <label class="calc__toggle">
          <input type="checkbox" id="calc-fuel-on">
          <span>Считать топливо (тягач + прицеп)</span>
        </label>

        <div class="calc__fuel" id="calc-fuel" hidden>
          <div class="calc__fields">
            <label class="calc__field">
              <span class="calc__field-label">Расход тягача, л/100 км</span>
              <input class="calc__input" id="calc-truck" type="number" inputmode="decimal"
                min="0" step="0.1" placeholder="27" autocomplete="off">
            </label>
            <label class="calc__field">
              <span class="calc__field-label">Расход прицепа, л/ч</span>
              <input class="calc__input" id="calc-trailer" type="number" inputmode="decimal"
                min="0" step="0.1" placeholder="1.8" autocomplete="off">
            </label>
          </div>
          <div class="calc__fuel-result" aria-live="polite">
            <div class="calc__fuel-row"><span>Тягач (по км)</span><span id="calc-fuel-truck">— л</span></div>
            <div class="calc__fuel-row"><span>Прицеп (по времени)</span><span id="calc-fuel-trailer">— л</span></div>
            <div class="calc__fuel-row calc__fuel-row--total"><span>Всего</span><span id="calc-fuel-total">— л</span></div>
          </div>
        </div>
      </div>

      <div class="calc__foot">
        <button class="btn btn--ghost" id="calc-reset" type="button">Сбросить</button>
        <button class="btn" id="calc-done" type="button">Закрыть</button>
      </div>
    </div>
  </div>

  <script type="module" src="assets/js/app.js?v=4"></script>
  <script type="module" src="assets/js/calc.js?v=4"></script>
</body>
</html>
